<!DOCTYPE html>
<html>
<head>
    <title>Lapor Pak Jombang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">📢 Aplikasi Lapor Pak Jombang</h2>
        <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
            <form action="/submit" method="POST" enctype="multipart/form-data">
                <input type="text" name="judul" class="form-control mb-3" placeholder="Judul Laporan" required>
                <select name="kategori" class="form-select mb-3">
                    <option>Jalan Rusak</option>
                    <option>Sampah</option>
                    <option>Lampu Jalan</option>
                </select>
                <textarea name="deskripsi" class="form-control mb-3" placeholder="Deskripsi..."></textarea>
                <input type="file" name="foto" class="form-control mb-3" accept="image/*" capture="environment" required>
                <button class="btn btn-success w-100">Kirim Laporan</button>
            </form>
        </div>
    </div>
</body>
</html>
